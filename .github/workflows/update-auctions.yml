name: Update Current Auctions

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-auctions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper and update HTML
        run: python auction-scripts/update_auctions_and_html.py

      - name: Commit changes if any
        run: |
          git config user.name "auction-bot"
          git config user.email "auction-bot@users.noreply.github.com"
          git add auctions.json index.html
          if git diff --cached --quiet; then
            echo "No changes to auctions or HTML"
          else
            git commit -m "Update current auctions listing"
            git push
          fi
